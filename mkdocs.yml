# Project information
site_name: Linux Upskill Challenge
site_url: https://wentao3225.github.io/linuxupskillchallenge-zh/
site_author: Livia Lima
site_description: >-
  A month-long course aimed at those who aspire to get Linux-related jobs in the industry - junior Linux sysadmin, DevOps-related work, and similar.
  Learn the skills required to sysadmin a remote Linux server from the commandline.

# Repository
repo_name: wentao3225/linuxupskillchallenge-zh
repo_url: https://github.com/wentao3225/linuxupskillchallenge-zh
edit_uri: blob/master/docs

# Copyright
copyright: Copyright &copy; 2012-2019 Steve Brorens (@snori74) <br> Open Source since 2020 under the terms of the Creative Commons Attribution 4.0 International License (CC BY 4.0). <br> 中文翻译版由 wentao3225 维护，译文与勘误同样以 CC BY 4.0 发布。

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - smarty
  - toc:
      toc_depth: 4

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Configuration
theme:
  name: material
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  font:
    text: Ubuntu
    code: Ubuntu Mono
  favicon: luc.png
  logo: luc.png

# Plugins
plugins:
  # i18n must come first so it localizes pages before other plugins run
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Start Here: 从这里开始
            How this works: 课程机制与常见问题
            Get Your Own Server: 搭建你自己的服务器
            Lessons: 每日课程
            Day 1 - Get to know your server: 第 1 天 - 认识你的服务器
            Day 2 - Basic navigation: 第 2 天 - 基础导航
            Day 3 - Power trip!: 第 3 天 - 权限加身！
            Day 4 - Installing software, exploring the file structure: 第 4 天 - 安装软件、探索文件结构
            Day 5 - More or less: 第 5 天 - more 与 less
            Day 6 - Editing with "vim": 第 6 天 - 用 “vim” 编辑
            Day 7 - The server and its services: 第 7 天 - 服务器与其服务
            Day 8 - The infamous "grep" and other text processors: 第 8 天 - 大名鼎鼎的 “grep” 与其他文本工具
            Day 9 - Diving into networking: 第 9 天 - 深入网络
            Day 10 - Scheduling tasks: 第 10 天 - 计划任务
            Day 11 - Finding things: 第 11 天 - 查找文件
            Day 12 - Transferring files: 第 12 天 - 传输文件
            Day 13 - Users and Groups: 第 13 天 - 用户与用户组
            Day 14 - Who has permission?: 第 14 天 - 权限归谁？
            Day 15 - Deeper into repositories: 第 15 天 - 深入软件仓库
            Day 16 - Archiving and compressing: 第 16 天 - 归档与压缩
            Day 17 - Build from the source: 第 17 天 - 从源码构建
            Day 18 - Log rotation: 第 18 天 - 日志轮转
            Day 19 - Inodes, symlinks and other shortcuts: 第 19 天 - inode、符号链接与其他捷径
            Day 20 - Scripting: 第 20 天 - 脚本编写
            What Now?: 接下来呢？
            Day 21 - What's next?: 第 21 天 - 下一步？

  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Customization
extra:
  annotate:
    json: [.s2]
  # 原作者的 Google Analytics（G-LKF1067ZTR）与社交链接已移除，避免站点数据打到上游账号。
  # 如需启用统计或社交卡片，请在此配置你自己的服务。

